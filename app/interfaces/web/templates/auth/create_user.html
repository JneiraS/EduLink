{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h5 mb-3">Creation de compte utilisateur</h2>
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="full_name">Nom complet</label>
                        <input class="form-control" id="full_name" name="full_name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" type="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="role">Role</label>
                        <select class="form-select" id="role" name="role" required>
                            {% for role in roles %}
                            <option value="{{ role.value }}">{{ role.value }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Mot de passe</label>
                        <input class="form-control" id="password" type="password" name="password" required>
                    </div>
                    <button class="btn btn-primary" type="submit">Creer le compte</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
