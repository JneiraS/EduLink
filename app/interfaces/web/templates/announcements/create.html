{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <span class="kicker">Annonces</span>
                <h1 class="page-title mb-4">Publier une annonce</h1>
                <form method="post" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="title">Titre</label>
                        <input class="form-control" id="title" name="title" required maxlength="255"
                            data-maxlength="255">
                        <small class="char-counter" data-counter-for="title" aria-live="polite"></small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="content">Contenu</label>
                        <textarea class="form-control" id="content" name="content" rows="5" required
                            maxlength="5000" data-maxlength="5000"></textarea>
                        <small class="char-counter" data-counter-for="content" aria-live="polite"></small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="document">Document PDF (optionnel)</label>
                        <label class="file-zone" for="document" id="file-zone" data-file-label>
                            <i class="bi bi-cloud-arrow-up" aria-hidden="true"></i>
                            <div><strong>Deposer un PDF</strong> ou cliquer pour parcourir</div>
                            <small class="text-muted">Maximum 5 Mo, format PDF.</small>
                        </label>
                        <input class="form-control d-none" id="document" name="document" type="file"
                            accept="application/pdf">
                    </div>
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-send me-2" aria-hidden="true"></i>Publier l'annonce
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
