{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm mb-3">
    <div class="card-body">
        <h1 class="h5 mb-0">Canal #{{ channel_id }}</h1>
    </div>
</div>

<div class="card shadow-sm mb-3">
    <div class="card-body" id="messages-container">
        {% if messages %}
        {% for m in messages %}
        <div class="mb-2 pb-2 border-bottom">
            <strong>Utilisateur {{ m.sender_id }}</strong>
            <small class="text-muted">{{ m.created_at }}</small>
            <div>{{ m.content }}</div>
        </div>
        {% endfor %}
        {% else %}
        <p class="text-muted mb-0">Aucun message.</p>
        {% endif %}
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="content">Votre message</label>
                <textarea class="form-control" id="content" name="content" rows="3" required></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Envoyer</button>
        </form>
    </div>
</div>
{% endblock %}
