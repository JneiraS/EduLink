{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center reveal-group">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <span class="kicker">Premier acces</span>
                <h1 class="page-title mb-2">Definissez votre mot de passe</h1>
                <p class="text-muted small mb-3">Bonjour {{ user.full_name }}. Choisissez un mot de passe pour activer
                    votre compte.</p>
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="password">Mot de passe</label>
                        <input class="form-control" id="password" type="password" name="password" required
                            minlength="8" maxlength="128" autocomplete="new-password">
                        <small class="form-text">8 a 128 caracteres.</small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="confirm">Confirmation</label>
                        <input class="form-control" id="confirm" type="password" name="confirm" required
                            autocomplete="new-password">
                    </div>
                    <button class="btn btn-primary w-100" type="submit">
                        <i class="bi bi-shield-check me-2" aria-hidden="true"></i>Activer mon compte
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
